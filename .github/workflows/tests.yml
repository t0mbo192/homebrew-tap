name: brew

# A formula is only known to work once Homebrew has actually built and run it,
# so this does exactly that on a real macOS runner, on every push.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Same script the updater runs before it pushes anything, so the two
      # cannot come to different conclusions about the same formula.
      - name: Build and test the formula
        run: ci/check-formula.sh
